     <li><strong>Exclude Default and Sales Transaction Type Pricing Procedures</strong> — paired with the above to enable custom hook behavior.</li>
   </ul>
   <p>Forgetting either of these is the classic reason a correctly-written Apex hook class never actually fires.</p>`},

 {cat:"Catalog Mgmt", title:"Catalog & Discovery Toggles", body:`
   <ul>
     <li><strong>Use Indexed Data for Product Listing and Search</strong> — once enabled, the product index must be rebuilt whenever products or product data change, or catalog changes won't reflect in search/browse.</li>
     <li><strong>Guided Product Selection</strong> — supports guided, wizard-style product selection experiences.</li>
     <li><strong>Ramp Deals</strong> (for Groups) — requires the enhanced Sales Transaction Line Editor component on the Quote page, introduced alongside it.</li>
   </ul>
   <p>These three often get enabled together during initial catalog setup, but each has its own downstream dependency (index rebuild, line editor component) that's easy to miss.</p>`},

 {cat:"DRO", title:"Order / DRO Toggles", body:`
   <ul>
     <li><strong>In-Flight Amendments</strong> setting — must be enabled under DRO Settings for in-flight order changes to be available at all.</li>
     <li><strong>Place Supplemental Orders</strong> permission — required alongside the setting above; without it, a user can see the feature but can't actually submit a change.</li>
   </ul>
   <p>Both apply only pre-assetization. If no asset has been created yet, an in-flight change should be possible with these two enabled; if it still fails, the order has likely already been assetized and needs the standard amendment path instead.</p>`},

 {cat:"Project Delivery", title:"Preparing for an Implementation", body:`
   <p>Salesforce's own implementation guide ("Get Ready for Your Revenue Management Implementation") frames readiness as a set of activities to complete BEFORE any configuration begins:</p>
   <ul>
     <li>Learn the features and technical architecture</li>
     <li>Assemble a dedicated implementation team</li>
     <li>Investigate pain points and assess current priorities</li>
     <li>Solicit input from key stakeholders</li>
     <li>Define clear business objectives</li>
     <li>Establish realistic milestones to guide the project</li>
   </ul>
   <p>This maps directly to the exam's "assign roles and responsibilities to stakeholders" and "develop a scope of work and project plan" objectives — this is the non-technical, delivery side of Implementation Readiness, distinct from the toggles/PSL material in the other cards here.</p>`},

 {cat:"Project Delivery", title:"User Acceptance Testing (UAT)", body:`
   <p>UAT is the LAST stage before go-live — it happens in a sandbox, after the technology team has already thoroughly tested the build. It's the direct match for the exam's "drive implementation through build, test, deployment, and adoption" objective.</p>
   <p><strong>Who leads it:</strong> typically a Business Analyst (BA), who has been the liaison between business and technology teams from the very first step of the project — which is exactly why they're positioned to lead this final step too.</p>
   <p><strong>What UAT is actually checking:</strong> not defects (that's QA/functional testing's job) — UAT confirms the system behaves as expected in REAL-WORLD business scenarios and is genuinely ready for real users.</p>
   <p><strong>Best practices:</strong> define acceptance criteria, create test cases, select the right users, write test scripts based on user stories, prepare the testing environment, and track every piece of feedback — bugs, change requests, and positive comments alike — then prioritize what actually needs fixing before launch.</p>`},

 {cat:"SF Foundations", title:"Screen Flow vs. OmniScript vs. FlexCard", body:`
   <p>All three put a UI in front of a user, but they solve different shapes of interaction:</p>
   <table style="width:100%; border-collapse:collapse; font-size:13.5px; color:var(--text-dim);">
     <tr style="border-bottom:1px solid var(--line);"><td style="padding:6px 4px; color:var(--text); font-weight:600;">Shape</td><td style="padding:6px 4px; color:var(--text); font-weight:600;">Screen Flow</td><td style="padding:6px 4px; color:var(--text); font-weight:600;">OmniScript</td><td style="padding:6px 4px; color:var(--text); font-weight:600;">FlexCard</td></tr>
     <tr style="border-bottom:1px solid var(--line);"><td style="padding:6px 4px;">Interaction</td><td style="padding:6px 4px;">Guided steps</td><td style="padding:6px 4px;">Guided steps</td><td style="padding:6px 4px;">At-a-glance + actions</td></tr>
     <tr style="border-bottom:1px solid var(--line);"><td style="padding:6px 4px;">Ecosystem</td><td style="padding:6px 4px;">Core Salesforce</td><td style="padding:6px 4px;">OmniStudio</td><td style="padding:6px 4px;">OmniStudio</td></tr>
     <tr><td style="padding:6px 4px;">Best for</td><td style="padding:6px 4px;">Process + data logic, no license needed</td><td style="padding:6px 4px;">Guided process, richer UI</td><td style="padding:6px 4px;">Summary display, quick actions</td></tr>
   </table>
   <p style="margin-top:12px;">The real-world pattern: a FlexCard shows a summary with a button that launches an OmniScript for the actual guided process — the two are frequently paired, not competing.</p>
   <p><strong>Exam heuristic:</strong> if a scenario names OmniStudio, FlexCards, or OmniScripts explicitly, reach for the OmniStudio answer. If it's a generic "guided process" with no OmniStudio context given, Screen Flow is the safer default — it doesn't assume a license the scenario didn't mention.</p>`},

 {cat:"SF Foundations", title:"Can You Skip OmniStudio Entirely?", body:`
   <p>Yes — and it's worth being clear-eyed about this as a real architectural choice, not a trick question. OmniStudio is a declarative ACCELERATOR built on the same primitives you'd use by hand, not an irreplaceable layer:</p>
   <ul>
     <li>FlexCard / OmniScript → auto-generate an LWC. A hand-written LWC (or Screen Flow) is the manual equivalent.</li>
     <li>Integration Procedure → server-side orchestration. An Apex class is the manual equivalent.</li>
     <li>Data Mapper → Salesforce read/write. SOQL/DML in Apex, or Flow's Get/Create/Update Records, is the manual equivalent.</li>
   </ul>
   <p><strong>Reasons teams choose OmniStudio:</strong> speed and lower-code maintenance (a BA can adjust it without a deploy), built-in reusability patterns for minimizing server round-trips, and OmniOut for running the same experience outside Salesforce.</p>
   <p><strong>Reasons teams choose native LWC/Apex/Flow instead:</strong> no separate license/cost, an already-strong pro-code team, mature Apex testing/CI-CD tooling, and finer-grained control over each server call.</p>
   <p>A described org with strong Apex/LWC skills and no OmniStudio licensing choosing the native path is a legitimate answer, not an error — the exam names OmniStudio as something to KNOW, not something that's mandatory for every implementation.</p>`},

 {cat:"SF Foundations", title:"Standard vs. Dynamic Dashboards: Running User", body:`
   <p>Every dashboard component points at a source report, not raw data — so a dashboard's security depends entirely on WHOSE access that underlying report runs as. This is the single most important dashboard security concept:</p>
   <ul>
     <li><strong>Standard Dashboard</strong> runs as ONE fixed "running user," the same for every viewer. Everyone sees identical data — including data they personally couldn't access on their own — because it's filtered through the running user's permissions, not the viewer's.</li>
     <li><strong>Dynamic Dashboard</strong> runs as "the logged-in user." Each viewer sees data filtered through their OWN access, so the same dashboard shows different slices of data to different people.</li>
   </ul>
   <p><strong>When to use which:</strong> Standard, when everyone genuinely should see the same numbers (an exec KPI dashboard). Dynamic, when different roles should see different slices of the same underlying data — e.g. regional sales managers each seeing only their own region's Revenue Cloud quotes and orders on the same dashboard layout.</p>`},

 {cat:"SF Foundations", title:"The Sharing & Security Model, as Concentric Rings", body:`
   <p>Salesforce's sharing model is layered — each layer can only WIDEN access beyond what came before it, never restrict:</p>
   <ol style="padding-left:20px; color:var(--text-dim); font-size:14.5px; line-height:1.6;">
     <li><strong>Organization-Wide Defaults (OWD)</strong> — the floor. Private, Public Read Only, or Public Read/Write, set per object.</li>
     <li><strong>Role Hierarchy</strong> — if OWD is Private, users above a record's owner automatically inherit access to it.</li>
     <li><strong>Sharing Rules</strong> — criteria- or ownership-based, opening up additional access. Can only grant, never restrict.</li>
     <li><strong>Manual Sharing</strong> — one specific record, shared one-off by a user or admin.</li>
     <li><strong>Apex Managed Sharing</strong> — programmatic, for logic too complex for declarative rules.</li>
   </ol>
   <p><strong>Field-Level Security (FLS) sits outside this stack entirely</strong> — it's an orthogonal layer. A user can pass every ring above and still see a record, while a specific FIELD on that record stays hidden via FLS on their Profile or Permission Set. Object/row access and field access are independently controlled.</p>
   <p><strong>Revenue Cloud tie-in:</strong> this is exactly why "remove the permission" (a data-access-layer control) is the correct way to restrict an asset action, while "hide the button" (a page-layout control) is not — a hidden button doesn't touch sharing, FLS, or permissions at all, so the underlying API call still succeeds if the permission is still granted.</p>`},

 {cat:"SF Foundations", title:"User Access Policies (UAP)", body:`
   <p>A standard, out-of-the-box Salesforce feature (not a custom build, not a managed package) for automating access provisioning — Setup → User Access Policies, with a matching official Trailhead module.</p>
   <ul>
     <li><strong>Not on by default</strong> — an admin has to enable it first, in User Management Settings.</li>
     <li><strong>What it automates:</strong> granting or revoking Permission Sets, Permission Set Groups, Permission Set Licenses, Package Licenses, Groups, and Queues.</li>
     <li><strong>Criteria:</strong> matched against standard or custom fields on the User object (Text, Picklist, Number, Checkbox).</li>
     <li><strong>Triggers:</strong> on user create, on user update, or applied manually/on-demand to users who already meet criteria.</li>
   </ul>
   <p>Salesforce positions this explicitly as the no-code replacement for what used to require custom Flow or Apex automation to provision user access — a org using UAP to auto-assign a Permission Set Group based on a user's role or department is using the feature exactly as designed, not building something unusual.</p>`},

 {cat:"Permissions", title:"Licenses to Plan For (PSLs)", body:`
   <p>Before any permission set can be assigned, the underlying Permission Set License has to exist and be assigned at the org/user level. Plan for these based on which modules the implementation touches:</p>
   <ul>
     <li><strong>Revenue Cloud User</strong> — foundational, almost always needed.</li>
     <li><strong>Product Configuration</strong> (Design, Discovery) — catalog and configuration work.</li>
     <li><strong>Rate Management / Usage Management / Wallet Management</strong> — only if usage-based pricing or wallets are in scope.</li>
     <li><strong>Tax (Admin, Config)</strong> — if tax calculation is configured.</li>
     <li><strong>Contract Lifecycle Management User</strong> — if Salesforce Contracts is in scope.</li>
     <li><strong>Salesforce Pricing Design Time / Run Time User</strong> and <strong>Context Service Admin / Runtime</strong> — the recurring build-vs-execute split.</li>
   </ul>
   <p>Assign only what's actually needed — over-assigning PSLs adds confusion without adding capability.</p>`},
];

/* ---------------- STORAGE (localStorage — works in a standalone downloaded file) ---------------- */
async function loadState(){
  try{
    const s = localStorage.getItem('rc-starred-cards');
    starred = s ? JSON.parse(s) : {};
  }catch(e){ starred = {}; }
  try{
    const c = localStorage.getItem('rc-checklist-progress');
    checklistState = c ? JSON.parse(c) : {};
  }catch(e){ checklistState = {}; }
}
async function saveStarred(){
  try{ localStorage.setItem('rc-starred-cards', JSON.stringify(starred)); }catch(e){}
}
async function saveChecklist(){
  try{ localStorage.setItem('rc-checklist-progress', JSON.stringify(checklistState)); }catch(e){}
}

/* ---------------- RENDER: CHIPS ---------------- */
function renderChips(){
  const chips = document.getElementById('chips');
  let cats = [];
  if(view==='cards') cats = CATEGORIES;
  else if(view==='concepts') cats = CONCEPT_CATEGORIES;
  else if(view==='checklist') cats = CHECKLIST_CATEGORIES;
  chips.style.display = cats.length ? 'flex' : 'none';
  const current = view==='concepts' ? conceptCat : (view==='checklist' ? checklistCat : activeCat);
  chips.innerHTML = cats.map(c =>
    `<div class="chip ${c===current?'active':''}" data-cat="${c}">${c}</div>`
  ).join('');
  chips.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(view==='concepts'){ conceptCat = el.dataset.cat; conceptIdx = 0; }
      else if(view==='checklist'){ checklistCat = el.dataset.cat; checklistIdx = 0; }
      else{
        activeCat = el.dataset.cat;
        if(view==='cards'){ cardIdx = 0; flipped = false; }
        if(view==='quiz'){ buildQuizPool(); }
      }
      render();
    });
  });
}

/* ---------------- RENDER: CARDS ---------------- */
function filteredCards(){
  return activeCat==='All' ? CARDS : CARDS.filter(c=>c.cat===activeCat);
}
function renderCards(){
  const deck = filteredCards();
  const main = document.getElementById('main');
  if(!deck.length){ main.innerHTML = '<div class="empty">No cards in this category.</div>'; return; }
  if(cardIdx >= deck.length) cardIdx = 0;
  const c = deck[cardIdx];
  const key = c.cat+'|'+c.term;
  main.innerHTML = `
    <div class="progress-row"><span>Card ${cardIdx+1} of ${deck.length}</span><span>${activeCat}</span></div>
    <div class="card" id="flipZone">
      <button class="star ${starred[key]?'on':''}" id="starBtn">${starred[key]?'★':'☆'}</button>
      <div class="tag">${c.cat}</div>
      ${flipped
        ? `<div class="def">${c.def}</div>`
        : `<div class="term serif">${c.term}</div>`}
      <div class="flip-hint">tap to ${flipped?'see term':'reveal'}</div>
    </div>
    <div class="card-controls">
      <button id="prevBtn">← Prev</button>
      <button id="shuffleBtn">Shuffle</button>
      <button class="primary" id="nextBtn">Next →</button>
    </div>
  `;
  document.getElementById('flipZone').addEventListener('click', (e)=>{
    if(e.target.id==='starBtn') return;
    flipped = !flipped; render();
  });
  document.getElementById('starBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    starred[key] = !starred[key];
    saveStarred();
    render();
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    cardIdx = (cardIdx-1+deck.length)%deck.length; flipped=false; render();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    cardIdx = (cardIdx+1)%deck.length; flipped=false; render();
  });
  document.getElementById('shuffleBtn').addEventListener('click', ()=>{
    cardIdx = Math.floor(Math.random()*deck.length); flipped=false; render();
  });
}

/* ---------------- RENDER: QUIZ ---------------- */
function buildQuizPool(){
  quizPool = (activeCat==='All' ? QUIZ : QUIZ.filter(q=>q.cat===activeCat)).slice();
  for(let i=quizPool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [quizPool[i],quizPool[j]]=[quizPool[j],quizPool[i]]; }
  quizIdx = 0; quizScore = 0; quizAnswered = false;
}
function renderQuiz(){
  const main = document.getElementById('main');
  if(!quizPool.length){ buildQuizPool(); }
  if(!quizPool.length){ main.innerHTML = '<div class="empty">No questions in this category.</div>'; return; }
  if(quizIdx >= quizPool.length){
    const pct = Math.round((quizScore/quizPool.length)*100);
    main.innerHTML = `
      <div class="quiz-summary">
        <div style="color:var(--text-dim); font-size:13px;">Quiz complete — ${activeCat}</div>
        <div class="score">${quizScore}/${quizPool.length}</div>
        <div class="pct">${pct}% correct</div>
        <button id="restartBtn">Try again</button>
      </div>`;
    document.getElementById('restartBtn').addEventListener('click', ()=>{ buildQuizPool(); render(); });
    return;
  }
  const q = quizPool[quizIdx];
  const letters = ['A','B','C','D'];
  main.innerHTML = `
    <div class="q-head"><span>Question ${quizIdx+1} of ${quizPool.length}</span><span>${q.cat}</span></div>
    <div class="q-text">${q.q}</div>
    <div id="optWrap">
      ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="letter">${letters[i]}</span>${o}</button>`).join('')}
    </div>
    <div class="explain" id="explainBox">${q.exp}</div>
    <button class="quiz-next" id="nextQBtn">${quizIdx+1===quizPool.length ? 'See results' : 'Next question →'}</button>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(quizAnswered) return;
      quizAnswered = true;
      const i = parseInt(btn.dataset.i);
      document.querySelectorAll('.opt').forEach(b=>{
        const bi = parseInt(b.dataset.i);
        if(bi===q.correct) b.classList.add('correct');
        else if(bi===i) b.classList.add('incorrect');
      });
      if(i===q.correct) quizScore++;
      document.getElementById('explainBox').classList.add('show');
      document.getElementById('nextQBtn').classList.add('show');
    });
  });
  document.getElementById('nextQBtn').addEventListener('click', ()=>{
    quizIdx++; quizAnswered = false; render();
  });
}

/* ---------------- RENDER: CHECKLIST ---------------- */
function filteredChecklistPages(){
  return checklistCat==='All' ? CHECKLIST_PAGES : CHECKLIST_PAGES.filter(p=>p.cat===checklistCat);
}
function renderChecklist(){
  const main = document.getElementById('main');
  const deck = filteredChecklistPages();
  if(!deck.length){ main.innerHTML = '<div class="empty">No checklist pages in this category.</div>'; return; }
  if(checklistIdx >= deck.length) checklistIdx = 0;
  const page = deck[checklistIdx];

  let doneCount = 0;
  const itemsHtml = page.items.map((txt, ii)=>{
    const k = page.domainId+'-'+page.sectionIndex+'-'+ii;
    const isDone = !!checklistState[k];
    if(isDone) doneCount++;
    return `<div class="item ${isDone?'done':''}">
      <div class="box ${isDone?'checked':''}" data-k="${k}">${isDone?'✓':''}</div>
      <p data-k="${k}">${txt}</p>
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="progress-row"><span>${checklistIdx+1} of ${deck.length}</span><span>${checklistCat}</span></div>
    <div class="topic-block">
      <h3 class="serif">${page.name}</h3>
      <div class="count">${page.domain} (${page.weight}) · ${doneCount}/${page.items.length} complete</div>
      ${itemsHtml}
    </div>
    <div class="card-controls">
      <button id="prevBtn">← Prev</button>
      <button class="primary" id="nextBtn">Next →</button>
    </div>
    <div class="reset-link" id="resetChecklist">Reset all checklist progress</div>
  `;

  main.querySelectorAll('[data-k]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.k;
      checklistState[k] = !checklistState[k];
      saveChecklist();
      renderChecklist();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    checklistIdx = (checklistIdx-1+deck.length)%deck.length; renderChecklist();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    checklistIdx = (checklistIdx+1)%deck.length; renderChecklist();
  });
  const resetEl = document.getElementById('resetChecklist');
  if(resetEl) resetEl.addEventListener('click', ()=>{
    checklistState = {};
    saveChecklist();
    renderChecklist();
  });
}

/* ---------------- MAIN RENDER ---------------- */
function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  const subMap = {
    cards: "Tap a card to flip it. Star the ones to drill again.",
    concepts: "Read-through cards on objects, relationships, and setup planning.",
    checklist: "Hands-on tasks to run in a sandbox. Progress is saved."
  };
  document.getElementById('headerSub').textContent = subMap[view];
  renderChips();
  if(view==='cards') renderCards();
  else if(view==='concepts') renderConcepts();
  else renderChecklist();
}

document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    view = btn.dataset.view;
    activeCat = 'All';
    cardIdx = 0; flipped = false;
    render();
  });
});

loadState().then(render);
</script>
